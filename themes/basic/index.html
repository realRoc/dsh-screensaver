<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 屏保主题：在沙盒 iframe 里跑（allow-scripts，没有同源权限），碰不到桌宠的接口，只管画。键鼠由外壳收。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <title>时钟</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    #glow {
      position: fixed; width: 60vmin; height: 60vmin; border-radius: 50%;
      background: radial-gradient(circle, rgba(90, 130, 255, 0.22), transparent 70%);
      filter: blur(20px); will-change: transform;
    }
    /* 照着系统锁屏：屏幕上方正中，一行日期，下面大号时间；SF 半粗、白色略透 */
    #clock {
      position: fixed; left: 0; right: 0; top: 8vh; text-align: center; color: #fff;
      font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif; text-shadow: 0 1px 16px rgba(0, 0, 0, 0.25);
    }
    #date { display: block; font-size: max(17px, 2.5vmin); line-height: 1.3; font-weight: 600; opacity: 0.8; letter-spacing: 0.01em; }
    #time { display: block; font-size: 15vmin; line-height: 1; font-weight: 620; opacity: 0.88; letter-spacing: -0.015em; margin-top: 0.4vmin; }
  </style>
</head>
<body>
  <div id="glow"></div>
  <div id="clock"><span id="date"></span><span id="time"></span></div>
  <script>
    const time = document.getElementById('time')
    const date = document.getElementById('date')
    const glow = document.getElementById('glow')
    const pad = (n) => String(n).padStart(2, '0')
    const DAYS = '日一二三四五六'
    // 屏保外壳在地址里给 ?lang=zh|en（跟系统语言）
    const zh = new URLSearchParams(location.search).get('lang') === 'zh'
    document.documentElement.lang = zh ? 'zh-CN' : 'en'
    function tick() {
      const d = new Date()
      time.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`
      date.textContent = zh
        ? `${d.getMonth() + 1}月${d.getDate()}日 星期${DAYS[d.getDay()]}`
        : d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
    }
    tick()
    setInterval(tick, 1000)
    // 光晕慢慢漂，防烧屏
    function drift(t) {
      const s = t / 1000
      const x = (Math.sin(s / 23) * 0.35 + 0.5) * innerWidth - glow.offsetWidth / 2
      const y = (Math.cos(s / 31) * 0.3 + 0.5) * innerHeight - glow.offsetHeight / 2
      glow.style.transform = `translate(${x}px, ${y}px)`
      requestAnimationFrame(drift)
    }
    requestAnimationFrame(drift)
  </script>
</body>
</html>
